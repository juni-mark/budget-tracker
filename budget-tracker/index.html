<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Budget Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/cat.css">
</head>
<body>
<div class="app">
  <p class="sr" id="live" role="status" aria-live="polite"></p>
  <main>
    <section class="screen on" id="screen-log">
      <header class="head">
        <div><div class="cap" id="dateCap"></div><h1>What did you spend today?</h1></div>
        <div class="streak"><div class="serif" id="streakNum">0</div><div class="cap">day streak</div></div>
      </header>
      <div class="week" id="week" aria-label="This week"></div>
      <div class="amt">
        <div class="cap" id="catName">Choose a category</div>
        <div class="amt-row"><span class="serif cur">฿</span><input id="amount" inputmode="numeric" maxlength="6" placeholder="0" aria-label="Amount"></div>
        <div class="chips" id="chips"><button class="chip" data-add="20">+20</button><button class="chip" data-add="50">+50</button><button class="chip" data-add="100">+100</button><button class="chip" data-add="0">Clear</button></div>
        <div class="track"><i id="goalFill"></i></div>
        <div class="sub" id="goalText" aria-live="polite"></div>
      </div>
      <div class="grid" id="tiles" role="group" aria-label="Category"></div>
      <button class="btn" id="logBtn" disabled>Log expense</button>
      <button class="link" id="noSpendBtn">Nothing spent today</button>
    </section>

    <section class="screen" id="screen-stats">
      <header class="head"><div><div class="cap" id="statsCap"></div><h1>Stats</h1></div><button class="icon" id="settingsBtn" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></header>
      <div class="seg" id="period"><button data-p="week">Week</button><button data-p="month" class="on">Month</button><button data-p="term">Term</button></div>
      <div>
        <div class="cap" id="remainLbl">Remaining</div>
        <div class="hero"><span class="serif" id="remain"></span><span class="sub" id="ofBudget"></span></div>
        <div class="track thin"><i id="budFill"></i></div>
      </div>
      <div class="kpis">
        <div><div class="cap">Spent</div><div class="serif" id="kSpent"></div></div>
        <button id="avgBtn"><div class="cap">Per day &rsaquo;</div><div class="serif" id="kAvg"></div></button>
        <div><div class="cap">Logged</div><div class="serif" id="kLog"></div></div>
      </div>
      <div><div class="cap">Spend vs budget pace</div><div id="trend"></div><div class="sub">Solid: actual / dashed: budget pace</div></div>
      <div><div class="cap" style="margin-bottom:6px">Top categories</div><div id="cats"></div></div>
      <div class="foot"><button class="link" id="sampleBtn">Load sample data</button><button class="link" id="resetBtn">Reset data</button></div>
    </section>
  </main>

  <div class="dock" id="dock"><div class="stage" aria-hidden="true"><div id="cat" data-state="sit"><div class="hopper"></div><span class="z">z</span></div></div></div>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button class="on" data-tab="log"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Log</button>
    <button data-tab="stats"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>Stats</button>
    <button data-tab="wrapped"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Wrapped</button>
  </nav>
</div>

<div class="layer" id="sheet" hidden><div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Daily spending"></div></div>
<div class="layer" id="settings" hidden><div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Settings"></div></div>
<div class="story" id="story" role="dialog" aria-modal="true" aria-label="Week in review" hidden></div>
<div class="story" id="onboard" role="dialog" aria-modal="true" aria-labelledby="obTitle" hidden></div>

<script src="js/core/utils.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/backup.js"></script>
<script src="js/core/sync.js"></script>
<script src="js/core/sample-data.js"></script>
<script src="js/components/charts.js"></script>
<script src="js/components/cat.js"></script>
<script src="js/screens/log.js"></script>
<script src="js/screens/stats.js"></script>
<script src="js/screens/daily-sheet.js"></script>
<script src="js/screens/wrapped.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/onboarding.js"></script>
<script src="js/components/tabs.js"></script>
<script src="js/components/pwa.js"></script>
<script src="js/components/a11y.js"></script>
<script src="js/app.js"></script>
</body>
</html>
